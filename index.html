<!DOCTYPE html>
<html lang="ja"> <head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>回路部品・在庫管理システム</title> <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }

        .panel { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
        label { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 2px; }
        
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background-color: #007bff; color: white; height: 40px; margin-top: 15px; }
        .btn-csv { background-color: #6c757d; color: white; font-size: 13px; margin-right: 5px; }
        .btn-clear { background-color: #dc3545; color: white; font-size: 13px; }
        .btn:hover { opacity: 0.8; }

        .search-group { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #1a73e8; display: flex; gap: 10px; margin-bottom: 10px; }
        .search-input { flex: 2; border: 1px solid #1a73e8; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background-color: #f8f9fa; padding: 10px; border-bottom: 2px solid #dee2e6; text-align: left; white-space: nowrap; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; background: #e8eaed; color: #5f6368; }
        .cell-input { width: 100%; border: 1px solid transparent; background: transparent; padding: 4px; box-sizing: border-box; }
        .cell-input:focus { border: 1px solid #1a73e8; background: white; outline: none; }
        .delete-btn { color: #d93025; background: none; border: none; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>回路部品・在庫管理システム</h1>

    <div class="panel">
        <!-- 基本情報 -->
        <div class="form-row">
            <div class="form-group"><label>商品名</label><input type="text" id="itemName" placeholder="例: 抵抗器"></div>
            <div class="form-group">
                <label>カテゴリ</label>
                <select id="itemCategory">
                    <option value="電子部品">電子部品</option>
                    <option value="締結部品">締結部品</option>
                    <option value="スプレー">スプレー</option>
                    <option value="道具">道具</option>
                </select>
            </div>
            <div class="form-group"><label>在庫数</label><input type="number" id="itemQty" placeholder="個数"></div>
        </div>

        <!-- 数値1〜3の入力 -->
        <div class="form-row">
            <div class="form-group"><label>電流 (A)</label><input type="number" id="valCurrent" step="0.01" placeholder="A"></div>
            <div class="form-group"><label>抵抗 (Ω)</label><input type="number" id="valResist" step="0.1" placeholder="Ω"></div>
            <div class="form-group"><label>直流電圧 (Vdc)</label><input type="number" id="valVdc" step="0.1" placeholder="Vdc"></div>
            <div class="form-group"><label>静電容量 (μF)</label><input type="number" id="valCap" step="0.01" placeholder="μF"></div>
            <div class="form-group"><label>交流電圧 (Vac)</label><input type="number" id="valVac" step="0.1" placeholder="Vac"></div>
            <button class="btn btn-add" onclick="addItem()">データ追加</button>
        </div>

        <div class="search-group">
            <input type="text" id="searchInput" class="search-input" placeholder="商品名で検索..." oninput="renderTable()">
            <select id="filterCategory" onchange="renderTable()">
                <option value="all">すべてのカテゴリ</option>
                <option value="電子部品">電子部品</option>
                <option value="締結部品">締結部品</option>
                <option value="スプレー">スプレー</option>
                <option value="道具">道具</option>
            </select>
        </div>

        <div>
            <button class="btn btn-csv" onclick="exportCSV()">CSV保存</button>
            <button class="btn btn-csv" onclick="document.getElementById('csvFile').click()">CSV読込</button>
            <input type="file" id="csvFile" style="display:none" accept=".csv" onchange="importCSV(event)">
            <button class="btn btn-clear" onclick="clearAllData()">全データクリア</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>カテゴリ</th>
                <th>商品名</th>
                <th>在庫</th>
                <th>電流(A)</th>
                <th>抵抗(Ω)</th>
                <th>直流(V)</th>
                <th>容量(μF)</th>
                <th>交流(V)</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="inventoryList"></tbody>
    </table>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('electroInventory')) || [];

    function saveAndRender() {
        localStorage.setItem('electroInventory', JSON.stringify(inventory));
        renderTable();
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        if (!name) return alert('商品名を入力してください');

        const newItem = {
            id: Date.now(),
            name: name,
            category: document.getElementById('itemCategory').value,
            qty: parseInt(document.getElementById('itemQty').value) || 0,
            current: document.getElementById('valCurrent').value || 0,
            resist: document.getElementById('valResist').value || 0,
            vdc: document.getElementById('valVdc').value || 0,
            cap: document.getElementById('valCap').value || 0,
            vac: document.getElementById('valVac').value || 0
        };

        inventory.push(newItem);
        // 入力欄をクリア
        document.querySelectorAll('.panel input').forEach(input => {
            if(input.id !== 'csvFile') input.value = '';
        });
        saveAndRender();
    }

    function updateField(id, field, value) {
        const item = inventory.find(i => i.id === id);
        if (item) {
            item[field] = (field === 'name' || field === 'category') ? value : value;
            localStorage.setItem('electroInventory', JSON.stringify(inventory));
        }
    }

    function deleteItem(id) {
        if(confirm('この項目を削除しますか？')) {
            inventory = inventory.filter(i => i.id !== id);
            saveAndRender();
        }
    }

    // 全データクリア機能
    function clearAllData() {
        if (inventory.length === 0) {
            return alert('削除するデータがありません。');
        }
        if (confirm('⚠️ 本当にすべてのデータを削除しますか？\nこの操作は元に戻せません。')) {
            inventory = [];
            localStorage.removeItem('electroInventory');
            renderTable();
        }
    }

    function renderTable() {
        const list = document.getElementById('inventoryList');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filterCat = document.getElementById('filterCategory').value;
        
        list.innerHTML = '';

        let displayList = inventory.filter(item => {
            const matchesSearch = item.name.toLowerCase().includes(searchTerm);
            const matchesCategory = filterCat === 'all' || item.category === filterCat;
            return matchesSearch && matchesCategory;
        });

        displayList.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge">${item.category}</span></td>
                <td><input type="text" class="cell-input" value="${item.name}" onchange="updateField(${item.id}, 'name', this.value)"></td>
                <td><input type="number" class="cell-input" style="width:60px" value="${item.qty}" onchange="updateField(${item.id}, 'qty', this.value)"></td>
                <td><input type="number" class="cell-input" step="0.01" value="${item.current}" onchange="updateField(${item.id}, 'current', this.value)"></td>
                <td><input type="number" class="cell-input" step="0.1" value="${item.resist}" onchange="updateField(${item.id}, 'resist', this.value)"></td>
                <td><input type="number" class="cell-input" step="0.1" value="${item.vdc}" onchange="updateField(${item.id}, 'vdc', this.value)"></td>
                <td><input type="number" class="cell-input" step="0.01" value="${item.cap}" onchange="updateField(${item.id}, 'cap', this.value)"></td>
                <td><input type="number" class="cell-input" step="0.1" value="${item.vac}" onchange="updateField(${item.id}, 'vac', this.value)"></td>
                <td><button class="delete-btn" onclick="deleteItem(${item.id})">削除</button></td>
            `;
            list.appendChild(tr);
        });
    }

    function exportCSV() {
        if (inventory.length === 0) return alert('書き出すデータがありません。');
        const csvRows = ["カテゴリ,商品名,在庫,電流(A),抵抗(Ω),直流電圧(V),静電容量(uF),交流電圧(V)"];
        inventory.forEach(i => {
            csvRows.push(`${i.category},${i.name},${i.qty},${i.current},${i.resist},${i.vdc},${i.cap},${i.vac}`);
        });
        const blob = new Blob(["\ufeff" + csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "electronic_parts_list.csv";
        link.click();
    }

    function importCSV(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const rows = event.target.result.split(/\r?\n/).slice(1);
            rows.forEach((row, index) => {
                if (!row.trim()) return;
                const p = row.split(',');
                if (p.length >= 2) {
                    inventory.push({ 
                        id: Date.now() + index,
                        category: p[0], name: p[1], qty: p[2], current: p[3], resist: p[4], vdc: p[5], cap: p[6], vac: p[7]
                    });
                }
            });
            saveAndRender();
            e.target.value = '';
        };
        reader.readAsText(e.target.files[0]);
    }

    renderTable();
</script>

</body>
</html>
